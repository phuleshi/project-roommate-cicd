version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 499989195746.dkr.ecr.ap-northeast-1.amazonaws.com

  build:
    commands:
      - echo Build Docker image...
      - cd server
      - docker build -t roomate-backend .
      - docker tag roomate-backend:latest 499989195746.dkr.ecr.ap-northeast-1.amazonaws.com/roomate-backend:latest

  post_build:
    commands:
      - echo Push Docker image...
      - docker push 499989195746.dkr.ecr.ap-northeast-1.amazonaws.com/roomate-backend:latest
      - echo Done